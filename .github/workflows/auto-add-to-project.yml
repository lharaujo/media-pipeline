name: Auto-add to project board

# Zero-checkout job: adds every new/reopened issue and PR to the org project
# board. Uses pull_request_target (not pull_request) so it runs without
# checking out any PR code. Uses the org-level secret AUTH_PR_GITHUB_TOKEN (active for all private repos)
# (project-scope PAT) to be set — until then, runs will fail cleanly.
on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      # actions/add-to-project pinned by SHA
      - uses: actions/add-to-project@5afcf98fcd03f1c2f92c3c83f58ae24323cc57fd # v2.0.0
        with:
          project-url: https://github.com/orgs/Leosforge-ai/projects/8
          github-token: ${{ secrets.AUTH_PR_GITHUB_TOKEN }}
